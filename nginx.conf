events {}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    upstream removi_app {
        server app:${APP_PORT};
    }

    server {
        listen 80;
        server_name ${SITE_DOMAIN};

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            try_files $uri =404;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen ${NGINX_LISTEN_HOST}:${NGINX_HTTPS_PORT} ssl;
        # Unix socket with PROXY protocol, written by render.sh when NGINX_PROXY_SOCKET is set.
        include /etc/nginx/proxy-socket*.conf;
        http2 on;
        server_name ${SITE_DOMAIN};

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        # Other security headers come from the app; adding them here would duplicate them.
        # No includeSubDomains: sibling subdomains and ports on these hosts are not all valid HTTPS.
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Host-specific extra locations of this server (sites/server/*.conf). No files -> nothing is loaded.
        include /etc/nginx/sites/server/*.conf;

        location / {
            proxy_pass http://removi_app;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }

    # Host-specific extra servers, mounted by docker-compose.override.yml. No files -> nothing is loaded.
    include /etc/nginx/sites/*.conf;
}
